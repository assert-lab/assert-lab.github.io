<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand brand-icon" href="{{ '/' | relative_url }}" aria-label="AS²ERT Lab, home">
      <img class="brand-logo" src="{{ '/assets/images/logo-a2.svg' | relative_url }}" alt="AS²ERT Lab">
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.navigation.main %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
