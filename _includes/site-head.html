<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.title != "" %}
<title>{{ page.title | strip_html | escape }} · {{ site.name }}</title>
{% else %}
<title>{{ site.name }} · AI for Safe Software Engineering and Testing</title>
{% endif %}
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#154734">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.title | default: site.name | strip_html | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ site.og_image | default: '/assets/images/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/theme-minimal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>document.documentElement.className += ' js';</script>
