<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.title != "" %}
<title>{{ page.title | strip_html | escape }} · {{ site.name }}</title>
{% else %}
<title>{{ site.name }} · AI for Safe Software Engineering and Testing</title>
{% endif %}
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#154734">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.title | default: site.name | strip_html | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=2">
<link rel="stylesheet" href="{{ '/assets/css/theme-minimal.css' | relative_url }}?v=30">
<script>document.documentElement.className += ' js';</script>
