# ---------------------------------------------------------------
# Peer-reviewed publications. Newest first; grouped by `year`.
#
# Fields
#   area     which section it appears in (key from pub_areas.yml)
#   year     used for ordering only; keep newest first within an area
#   title    paper title (put it in quotes)
#   authors  a list. The PI's name is bolded automatically
#            (it must match `pi_name` in _config.yml exactly)
#   venue    full venue name
#   short    short venue label, shown in bold green (e.g. "ICSE 2025")
#   status   optional: "preprint" shows a small tag
#   note     optional, e.g. "Acceptance rate: 25%"
#   links    optional list of { label, url }
# ---------------------------------------------------------------

