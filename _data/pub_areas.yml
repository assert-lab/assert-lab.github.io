# ---------------------------------------------------------------
# Research areas shown on the Publications page, in this order.
# `key` must match the `area` field of entries in publications.yml.
# `figure` is a file in assets/images/ (optional).
# `tagline` is the one-line text on the landing page; `long` is the longer text on the Research page.
# `extras` adds non-paper links.
# `show_empty: true` keeps a section visible even with no papers yet.
# ---------------------------------------------------------------

- key: testing
  group: classical
  title: "Software testing and test oracles"
  tagline: "Test oracles, test adequacy, and automated test generation."
  long: "We develop methods to assess and improve the effectiveness of software testing. Our research examines test adequacy, the correctness and strength of test oracles, checked coverage, mutation testing, and automated test generation. A central question is whether tests can detect incorrect behavior, even when they achieve high structural coverage."
  blurb: "How do we know a test checks the right thing? We generate and evaluate test oracles, measure what tests miss, and use oracles to guide test generation."
  figure: pub-testing.svg
  alt: "The same set of behaviors judged by an oracle whose boundary separates correct behavior from faults"

- key: specs
  group: classical
  title: "Software specifications and intended behavior"
  tagline: "Recovering what software is meant to do."
  long: "Software requirements are spread across documentation, source code, tests, and development histories. We investigate how to recover intended behavior from these artifacts, how documentation and code patterns shape what AI systems infer about it, and how to turn it into executable checks."
  blurb: "What should the software do? We recover intent from documentation, code, and tests, and study where they disagree."
  figure: pub-specs.svg
  alt: "Three overlapping sources of intent, documentation, code, and tests, with agreement at the center and disagreements at the edges"

- key: ai
  group: agent
  title: "Trustworthy AI and agents"
  tagline: "How much can we trust AI that works on software?"
  long: "We study the reliability of large language models used in software development, including how they reason about conflicting evidence from code, documentation, and tests, and how much they trust each source."
  blurb: "Can we trust AI that reads and changes software? We study how models handle conflicting evidence."
  figure: pub-ai.svg
  alt: "A guard that covers only part of what a tool can actually do"

- key: debug
  group: classical
  title: "Debugging, fault analysis, and repair"
  tagline: "Finding, explaining, and fixing failures."
  long: "We investigate how software failures can be detected, explained, localized, and repaired. Our research combines program analysis, machine learning, and empirical studies of real-world defects."
  blurb: "How do we find, explain, and fix failures? We combine program analysis and learning with studies of real bugs."
  figure: pub-debug.svg
  alt: "Suspicion narrowing onto one line of code, followed by a repair"

- key: quantum
  group: quantum
  title: "Quantum software assurance"
  tagline: "Telling software bugs from hardware noise."
  long: "We are extending software testing and verification to quantum software, where outputs are statistical and hardware is noisy. This is an emerging direction for the lab."
  blurb: "How do we check software whose outputs are statistical and whose hardware is noisy? An emerging direction for the lab."
  figure: pub-quantum.svg
  alt: "Two quantum states that look identical in one measurement direction and differ in another"
  show_empty: true
  empty_note: "Publications in this area will appear here."

- key: infra
  group: classical
  title: "Datasets, benchmarks, and tools"
  figure: pub-datasets.svg
  tagline: "Datasets, benchmarks, and tools for the community."
  long: "Across these areas we build reusable tools, datasets, and benchmarks, so that results can be measured and reproduced by others."
  blurb: "Reusable infrastructure that lets the community measure progress and reproduce results."
  extras:
    - { tag: "SWE-MIMIC-BENCH", url: "https://github.com/Geek-a-Byte/SWE-MIMIC-BENCH" }
