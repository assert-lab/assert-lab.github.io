# ---------------------------------------------------------------
# Lab news. Newest first. The homepage shows the first 4 items;
# the News page shows everything, grouped by `year`.
#
# To add an item, copy a block, paste it at the TOP, and edit.
# `short` is the one-line headline shown on the homepage.
# `text` (full version, shown on the News page) may contain HTML (links, <strong>). Keep the `>-` and the
# indentation exactly as shown.
# ---------------------------------------------------------------

- date: "Jul 2026"
  year: 2026
  short: "Paper accepted at ASE 2026: Documentation vs. Code Patterns"
  text: >-
    Our paper, “Documentation vs. Code Patterns: What Drives LLM-Based Exception Oracle Generation?” has been accepted at the 41st IEEE/ACM International Conference on Automated Software Engineering (ASE 2026)!

- date: "Jul 2026"
  year: 2026
  short: "CoCoMUT accepted at ISSTA 2026 Tool Demonstrations"
  text: >-
    Our tool paper, “CoCoMUT: A Tool for Code-Context Mining and Automated Dataset Generation,” has been accepted at the 35th International Symposium on Software Testing and Analysis (ISSTA 2026) Tool Demonstration Track and is now available <a href="https://arxiv.org/abs/2606.31971">online</a>.

- date: "Jun 2026"
  year: 2026
  short: "PITMuS accepted at ASE 2026 Tools and Datasets"
  text: >-
    Our tool paper, “PITMuS: A Tool for Automated Bug Dataset Generation via Source-Level Mutant Reconstruction,” has been accepted at the 41st IEEE/ACM International Conference on Automated Software Engineering (ASE 2026) Tools and Datasets Track!

- date: "Apr 2026"
  year: 2026
  short: "TOGBench accepted at AIware 2026"
  text: >-
    Our dataset and benchmark paper, “TOGBench: A Developer-Written Multi-Variant Dataset and Benchmark Suite for Test Oracle Generation,” has been accepted to the 3rd ACM International Conference on AI-Powered Software (AIware 2026)!

- date: "Apr 2026"
  year: 2026
  short: "New paper: Measuring LLM Trust Allocation Across Conflicting Software Artifacts"
  text: >-
    Our research paper, “Measuring LLM Trust Allocation Across Conflicting Software Artifacts,” is now available <a href="https://arxiv.org/abs/2604.03447">online</a>.

- date: "Apr 2026"
  year: 2026
  short: "New paper: From Threads to Trajectories"
  text: >-
    Our paper, “From Threads to Trajectories: A Multi-LLM Pipeline for Community Knowledge Extraction from GitHub Issue Discussions,” is now available <a href="https://arxiv.org/abs/2604.25880">online</a>.

